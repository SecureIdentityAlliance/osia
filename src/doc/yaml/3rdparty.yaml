openapi: 3.0.0
info:
  description: |
    The OSIA Authentic Sources Services Interface
    
    Change log:
    - 2.0.0: 
      - Adapt to eIDAS requirements for Authentic Sources Services (ETSI TS 119 478 compliant)
    - 1.2.1:
      - Remove followRef
    - 1.2.0:
      - Add structures to manage data encryption and integrity
      - encounterId not read only in BiometricData
      - Rename to "Third Party Services" and remove existing tag
    - 1.1.1:
      - Add missing values in BiometricSubType
    - 1.1.0:
      - Change date to date-time
      - Add the encounterId to biometricData
      - Add the impressionType, mimeType, template, templateRef, templateFormat to biometricData
      - Do not mix fixed properties and additional properties, use a subobject for the additional properties
      - add credentialNumber, issuingAuthority, issuingPlace to the credential
      - Add quality, qualityFormat, algorithm, vendor fields to biometricData
      - Mark some fields (ID, etc.) as readOnly
    - 1.0.0: Initial version

  version: 2.0.0
  title: The OSIA Authentic Sources Services Interface
  license:
    name: SIA
    url: "https://raw.githubusercontent.com/SecureIdentityAlliance/osia/master/LICENSE"
servers:
   - url: https://3rdparty.server.com

paths:

  /v1/semanticRepository/{assetType}:
    get:
      summary: allows to search the semantic repository for attribute-related metadata
      description: >-
        This interface is implemented by a semantic repository which is a catalogue of semantic assets
        (e.g. attributes, attestation schemes, code lists) enabling the discovery of the unique identifier
        for a specific attribute and related semantic information and data models.
      operationId: findAttribute
      parameters:
        - name: assetType
          in: path
          description: Asset type to search for; shall be `attribute`
          required: true
          schema:
            type: string
          example: "attribute"
        - name: creator
          in: query
          description: Filter results by attribute creator name
          required: false
          schema:
            type: string
          example: "University of Padova"
        - name: country
          in: query
          description: Filter results by country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
          example: "FR"
        - name: text
          in: query
          description: Free-text search across attribute metadata
          required: false
          schema:
            type: string
        - name: semanticDataSpecification
          in: query
          description: URI to filter for a specific semantic data specification
          required: false
          schema:
            type: string
            format: uri
        - name: schemaMediaType
          in: query
          description: Media type according to IETF RFC 6838 to filter schema distributions
          required: false
          schema:
            type: string
          example: "application/json"

      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/findAttributeResponse'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/dataServiceDirectory/{queryType}:
    get:
      summary: allows to search the metadata of the authentic source(s) that support data services (verification, retrieval etc.) for the queried attribute(s).
      description: >-
        This interface is implemented by a Data Service Directory which is a registry of authentic sources
        and their data services. 
      operationId: findAuthenticSource
      parameters:
        - name: queryType
          in: path
          description: Query type; shall be `dataServices`
          required: true
          schema:
            type: string
        - name: attributeIdentifier
          in: query
          description: Unique URI identifier for the attribute
          required: true
          schema:
            type: string
            format: uri
        - name: country
          in: query
          description: Filter data services by country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/findAuthenticSourceResponse'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/DiscoveryDataServiceDirectory:
    get:
      summary: allows to search the endpoint of the relevant regional or national Data Service Directory and the semantic repository that the Data Service Directory supports. 
      description: >-
        This interface is implemented by a discovery system for Data Service Directories
      operationId: findDataServiceDirectory
      parameters:
        - name: country
          in: query
          description: Country code of the targeted country (ISO 3166-1 alpha-2)
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
          example: "FR"
      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/findDataServiceDirectoryResponse'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/verify:
    post:
      summary: Verify attributes against the authentic source without retrieving full data.
      description: >-
        Supports full attribute verification, fragment verification (privacy-preserving using JSONPath), or both.
        In the case of attributes or attributesFragment, the verification provides a result for each attribute. 
        In the case of attributeSet, the verification is matching all provided identity attributes in the set and computes a global matching result.
        The required identification data of the user shall be contained in the access token provided by the Authorization Server.
      operationId: verifyIdentity
      security:
        - BearerAuth: [id.verify]
      parameters:
        - name: transactionId
          in: query
          description: The client specified id of the transaction
          required: true
          schema:
            type: string
      requestBody:
        description: >-
          Attributes, fragments, or attribute sets to verify
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
    
      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        202:
          description: Deferred response; poll for async result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskId'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Authentication or authorization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Insufficient permissions or consent required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        501:
          description: Optional feature not implemented (fragments, mandate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  
            
  /v2/readAttributes:
    post:
      summary: Retrieve actual attribute values from the authentic source
      description: Returns value of attributes listed in the request
      operationId: readAttributes
      security:
        - BearerAuth: [id.read]
      parameters:
        - name: transactionId
          in: query
          description: The client specified id of the transaction
          required: true
          schema:
            type: string          
      requestBody:
        description: Attributes or attribute set to retrieve
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadAttributesRequest'
        required: true

      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAttributesResponse'
        202:
          description: Deferred response; poll for async result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskId'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Authentication or authorization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Insufficient permissions or consent required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        501:
          description: Optional feature not implemented (fragments, mandate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /v2/identify:
    post:
      summary:  Identify a set of persons matching provided partial attributes
      description: >-
        Identify possibly matching identities against an input set of attributes. Returns an array of predefined datasets as described by outputDataSetName.
        Note this request may be asynchronous or synchronous. This service may be limited to specific government RPs e.g. law enforcement agencies.
      operationId: identify
      security:
        - BearerAuth: [id.identify]
      parameters:
        - name: transactionId
          in: query
          description: The client specified id of the transaction
          required: true
          schema:
            type: string
      requestBody:
        description: >-
            A set of identity attributes to match and an outputattributeSet to use as template for returned matching identities.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyRequest"
        required: true
    
      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResponse'
        202:
          description: Deferred response; poll for async result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskId'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Authentication or authorization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Insufficient permissions or consent required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        501:
          description: Optional feature not implemented (fragments, mandate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

                
  /v2/identify/{taskId}:
    get:
      summary: Read the result of a previously sent identify request
      operationId: readIdentifyResult
      security:
        - BearerAuth: [id.identify]
      parameters:
        - name: taskId
          in: path
          description: taskId to get result for.
          required: true
          schema:
            type: string
          example : "ABCDEFGHIJKLMNO"
        - name: transactionId
          in: query
          description: The client specified id of the transaction
          required: true
          schema:
            type: string

      responses:
        200:
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResponse'
        400:
          description: Malformed or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Authentication or authorization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Insufficient permissions or consent required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Resource, person, or attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        408:
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        501:
          description: Optional feature not implemented (fragments, mandate)
          content:
