components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Discovery Responses
    findAttributeResponse:
      type: object
      required:
        - attributes
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeMetadata'
      additionalProperties: false

    AttributeMetadata:
      type: object
      required:
        - attributeIdentifier
        - schemaDistribution
      properties:
        attributeIdentifier:
          type: string
          format: uri
          description: Unique URI identifier for the attribute
        title:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        description:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        creator:
          type: string
          description: Name of the entity that created the attribute definition
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: Country code of the attribute creator (ISO 3166-1 alpha-2)
        semanticDataSpecification:
          type: string
          format: uri
          description: URI of the semantic data specification
        schemaDistribution:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SchemaDistribution'
      additionalProperties: false

    SchemaDistribution:
      type: object
      required:
        - accessUri
        - mediaType
      properties:
        accessUri:
          type: string
          format: uri
          description: URL to access the schema definition
        mediaType:
          type: string
          description: Media type of the schema (e.g., application/json)
      additionalProperties: false

    findAuthenticSourceResponse:
      type: object
      required:
        - dataServices
      properties:
        dataServices:
          type: array
          items:
            $ref: '#/components/schemas/DataService'
      additionalProperties: false

    DataService:
      type: object
      required:
        - attributeIdentifier
        - endpointDescription
        - endpointURI
        - provider
      properties:
        attributeIdentifier:
          type: string
          format: uri
        endpointDescription:
          type: string
          format: uri
          description: URL to the API specification (e.g., OpenAPI document)
        endpointURI:
          type: string
          format: uri
          description: Base URL of the verification/retrieval service
        provider:
          $ref: '#/components/schemas/Provider'
        country:
          type: string
          pattern: "^[A-Z]{2}$"
      additionalProperties: false

    findDataServiceDirectoryResponse:
      type: object
      required:
        - DSDuri
        - SRuri
        - country
      properties:
        DSDuri:
          type: string
          format: uri
          description: Data Service Directory URI
        SRuri:
          type: string
          format: uri
          description: Semantic Repository URI
        countries:
          type: array
          items:
            type: string
            pattern: "^[A-Z]{2}$"
          description: List of supported countries
      additionalProperties: false

    # Core Data Types
    LocalizedText:
      type: object
      required:
        - value
        - language
      properties:
        value:
          type: string
        language:
          type: string
          pattern: "^[a-z]{2}$"
          description: Two-letter language code (ISO 639-1)
      additionalProperties: false

    Provider:
      type: object
      required:
        - legalName
      properties:
        legalName:
          type: string
          description: Current legal name of the entity
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderIdentifier'
        establishedByLaw:
          $ref: '#/components/schemas/EstablishedByLaw'
        currentAddress:
          type: string
      additionalProperties: false

    ProviderIdentifier:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the identifier scheme
        identifier:
          type: string
      additionalProperties: false

    EstablishedByLaw:
      type: object
      properties:
        legislativeIdentifier:
          type: string
          format: uri
        legalBasis:
          type: string
      additionalProperties: false

    # Verification
    VerifyRequest:
      type: object
      properties:
        attributes:
          type: array
          description: Complete attributes to verify
          items:
            $ref: '#/components/schemas/VerificationAttribute'
        attributeFragments:
          type: array
          description: Attribute fragments for privacy-preserving verification using JSONPath
          items:
            $ref: '#/components/schemas/AttributeFragment'
        attributeSet:
          $ref: '#/components/schemas/AttributeSet'
        mandate:
          $ref: '#/components/schemas/Mandate'
      additionalProperties: false

    VerificationAttribute:
      type: object
      required:
        - attributeIdentifier
        - attributeValue
      properties:
        attributeIdentifier:
          type: string
          format: uri
        attributeValue:
          type: object
      additionalProperties: false

    AttributeFragment:
      type: object
      required:
        - attributeIdentifier
        - location
        - value
      properties:
        attributeIdentifier:
          type: string
          format: uri
        location:
          type: string
          description: JSONPath expression (IETF RFC 9535)
        value: {}
      additionalProperties: false

    VerifyResponse:
      type: object
      required:
        - responseId
        - provider
      properties:
        responseId:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/Provider'
        authenticSource:
          $ref: '#/components/schemas/Provider'
        attributeVerificationResults:
          type: array
          items:
            $ref: '#/components/schemas/AttributeVerificationResult'
        attributeFragmentVerificationResults:
          type: array
          items:
            $ref: '#/components/schemas/attributeFragmentVerificationResult'
        attributeSetResults:
          type: array
          items:
            $ref: '#/components/schemas/AttributeSetVerificationResult'
        mandateResult:
          $ref: '#/components/schemas/MandateResult'
      additionalProperties: false

    AttributeVerificationResult:
      type: object
      required:
        - attributeIdentifier
        - attributeVerificationResult
        - VerificationResult
      properties:
        attributeIdentifier:
          type: string
          format: uri
        attributeVerificationResult:
          type: string
          format: uri
          enum:
            - "http://uri.etsi.org/19478/VerificationResult/Match"
            - "http://uri.etsi.org/19478/VerificationResult/NoMatch"
            - "http://uri.etsi.org/19478/VerificationResult/MatchWithVariation"
            - "http://uri.etsi.org/19478/VerificationResult/Unknown"
        VerificationResult:
          type: string
          enum: [Match, NoMatch, MatchWithVariation, Unknown]
        attributeValue:
          type: object
      additionalProperties: false

    attributeFragmentVerificationResult:
      type: object
      required:
        - attributeIdentifier
        - location
        - attributeFragmentVerificationResult
        - VerificationResult
      properties:
        attributeIdentifier:
          type: string
          format: uri
        location:
          type: string
        attributeFragmentVerificationResult:
          type: string
          format: uri
          enum:
            - "http://uri.etsi.org/19478/VerificationResult/Match"
            - "http://uri.etsi.org/19478/VerificationResult/NoMatch"
            - "http://uri.etsi.org/19478/VerificationResult/MatchWithVariation"
            - "http://uri.etsi.org/19478/VerificationResult/Unknown"
        VerificationResult:
          type: string
          enum: [Match, NoMatch, MatchWithVariation, Unknown]
        attributeFragmentValue: {}
      additionalProperties: false

    AttributeSetVerificationResult:
      type: object
      required:
        - attributeSetIdentifier
        - VerificationResult
      properties:
        attributeSetIdentifier:
          type: string
          format: uri
        location:
          type: string
          description: JSONPath expression indicating matched location within the attribute set
        attributeSetVerificationResult:
          type: string
          format: uri
          enum:
            - "http://uri.etsi.org/19478/VerificationResult/Match"
            - "http://uri.etsi.org/19478/VerificationResult/NoMatch"
            - "http://uri.etsi.org/19478/VerificationResult/MatchWithVariation"
            - "http://uri.etsi.org/19478/VerificationResult/Unknown"
        VerificationResult:
          type: string
          enum: [Match, NoMatch, MatchWithVariation, Unknown]
        attributeFragmentValue:
          description: The actual value that was matched
      additionalProperties: false

    # Retrieval
    ReadAttributesRequest:
      type: object
      properties:
        attributes:
          type: array
          description: URIs of attributes to retrieve from the authentic source
          minItems: 1
          items:
            type: string
            format: uri
        attributeSet:
          $ref: '#/components/schemas/AttributeSet'
        mandate:
          $ref: '#/components/schemas/Mandate'
      additionalProperties: false

    ReadAttributesResponse:
      type: object
      required:
        - responseId
        - provider
      properties:
        responseId:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/Provider'
        authenticSource:
          $ref: '#/components/schemas/Provider'
        attributeReadResults:
          type: array
          items:
            $ref: '#/components/schemas/ReadAttribute'
        attributeSetReadResults:
          type: array
          items:
            $ref: '#/components/schemas/AttributeSetReadResult'
        mandateResult:
          $ref: '#/components/schemas/MandateResult'
      additionalProperties: false

    ReadAttribute:
      type: object
      required:
        - attributeIdentifier
        - attributeValue
        - stringRetrieveResult
      properties:
        attributeIdentifier:
          type: string
          format: uri
        attributeValue:
          type: object
        stringRetrieveResult:
          type: string
          enum: [Success, Failure]
      additionalProperties: false

    AttributeSetReadResult:
      type: object
      required:
        - attributeSetIdentifier
        - attributes
      properties:
        attributeSetIdentifier:
          type: string
          format: uri
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ReadAttribute'
      additionalProperties: false

    # Identification
    IdentifyRequest:
      type: object
      description: a set of parameters used in identify
      required:
        - attributeSet
        - outputAttributeSetIdentifier
      properties:
        attributeSet:
          $ref: '#/components/schemas/AttributeSet'
        outputAttributeSetIdentifier:
          description: Attribute set uri describing what attributes are to be read. e.g. "DEFAULT_SET_01", "SET_BIOM_01", "EIDAS", ...
          type: string
          format: uri
      additionalProperties: false

    IdentifyResponse:
      type: object
      required:
        - responseId
        - provider
        - identifiedPersons
      properties:
        responseId:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/Provider'
        authenticSource:
          $ref: '#/components/schemas/Provider'
        identifiedPersons:
          type: array
          items:
            $ref: '#/components/schemas/AttributeSet'
        totalMatches:
          type: integer
        mandateResult:
          $ref: '#/components/schemas/MandateResult'
      additionalProperties: false

    AttributeSet:
      type: object
      description: A set of attributes for verification, retrieval, or identification
      properties:
        attributeSetIdentifier:
          type: string
          format: uri
        biographicData:
          $ref: '#/components/schemas/BiographicData'
        biometricData:
          type: array
          items:
            $ref: '#/components/schemas/BiometricData'
        credentialData:
          type: array
          items:
            $ref: '#/components/schemas/CredentialData'
        contactData:
          $ref: '#/components/schemas/ContactData'
        encryption:
          $ref: '#/components/schemas/Encryption'
        integrity:
          type: array
          items:
            $ref: '#/components/schemas/Integrity'
      additionalProperties: false
      
    Encryption:
      type: object
      description: if present, indicates that a part of the data is encrypted using the provided format.
      required:
        - type
        - scope
      properties:
        type:
          type: string
          enum: [JWE, PKCS7]
        scope:
          description: |
            A whitespace-separated list of JSON paths to nodes containing encrypted data.
            For each node:

            - If the node is a JSON object, the full content is encrypted and the node transformed to a single buffer.
              Canonicalization is recommended before encryption but not mandatory.
            - If the node is an embedded buffer (image, PDF, etc.), the value is replaced with the encrypted data.
            - If the node is a URL to a buffer, the node remains a URL in clear format but the
              pointed buffer is encrypted.
          type: string
      additionalProperties: false
    Integrity:
      description: |
        Object describing the integrity (hash and signature) of a sub set of data.

        It is possible to calculate multiple integrity blocks corresponding to different
        use cases: integrity before encryption, integrity limited to a small sub set of data and easy
        to check, etc.
      type: object
      required:
        - scope
        - alg
        - hash
      properties:
        id:
          type: string
          description: An optional ID used in JSONPath expression to select a single integrity object
        type:
          type: string
          description: |
            Format of the signature of the hash.

            Cryptographic signature is optional. Use NONE when only the hash is required.
          enum: [NONE, JWS, PKCS7]
          default: NONE
        scope:
          description: |
            A whitespace-separated list of JSON paths to nodes containing the data to include in the
            hash calculation.

            It is used to build a JSON limited to the nodes identified in this scope. Then this
            JSON is canonicalized and a hash is calculated.
          type: string
        alg:
          description: |
            Hash algorithm used to calculate the hash.
            Example of possible values: SHA256, SHA384, SHA512.
          type: string
        encrypted:
          description: if true, indicates that the hash was calculated using encrypted data.
          type: boolean
          default: false
        hash:
          description: |
            Hash calculated from the attributes listed in scope. Hash is calculated using the following process:

            - Build an intermediate JSON containing only the fields identified in the scope
            - Canonicalize the JSON using RFC8785
            - Hash the result
          type: string
        signature:
          description: |
            the signature of the hash.
            Compact format is used for JWS and PEM format for PKCS7.
          type: string
        signatureRef:
          type: string
          format: uri
          description: URI to the signature data. DER format is accepted for PKCS7 to optimize the storage space.
          example: "https://objectserver.com/signature?id=00003"
      additionalProperties: false

    BiographicData:
      type: object
      description: The set of biographic data.
      additionalProperties: true
      example:
        firstName: John
        lastName: Doo
        dateOfBirth: "1985-11-30"
        gender: M
        nationality: FRA
    
    ContactData:
      type: object
      additionalProperties: true
      description: The set of contact data.
      example:
        email: John.Doo@osia.com
        phone1: "555666777"
        phone2: "555888999"
        
    BiometricData:
      type: object
      required:
        - biometricType
      properties:
        biometricType:
          $ref: '#/components/schemas/BiometricType'
        biometricSubType:
          $ref: '#/components/schemas/BiometricSubType'
        instance:
          type: string
          description: Used to separate two distincts biometric items of the same type and subtype
        encounterId:
          type: string
          description: the id of the encounter owner of this biometric
        image:
          type: string
          description: Encoded image buffer
        imageRef:
          type: string
          format: uri
          description: URI to an image
          example: "http://imageserver.com/image?id=00003"
        captureDate:
          description: Data & time of the data capture, using RFC3339 format
          type: string
          format: date-time
          example: "2019-05-21T12:00:00+01:00"
        captureDevice:
          type: string
          description: A string identifying the device used to capture the biometric
        impressionType:
          $ref: '#/components/schemas/ImpressionType'
        width:
          type: integer
          description: the width of the image
        height:
          type: integer
          description: the height of the image
        bitdepth:
          type: integer
        mimeType:
          type: string
          description: the nature and format of the image. The mime type definitions should be in compliance with RFC 6838.
        resolution:
          type: integer
          description: the image resolution (in DPI)
        compression:
          $ref: '#/components/schemas/CompressionType'
        missing:
          description: Optional properties indicating if a part of the biometric data is missing
          type: array
          items:
            $ref: '#/components/schemas/MissingType'
        metadata:
          type: string
          description: An optional string used to convey information vendor-specific
        comment:
          type: string
          description: A comment about the biometric data
        template:
          type: string
          description: Encoded template buffer
        templateRef:
          type: string
          format: uri
          description: URI to the template when it is managed in a dedicated data server
          example: "http://dataserver.com/template?id=00014"
        templateFormat:
          $ref: '#/components/schemas/TemplateFormat'
        quality:
          type: integer
          format: int64
          description: Quality, as a number, of the biometric
        qualityFormat:
          $ref: '#/components/schemas/QualityFormat'
        algorithm:
          type: string
        vendor:
          type: string
        encryption:
          $ref: '#/components/schemas/Encryption'
        integrity:
          type: array
          items:
            $ref: '#/components/schemas/Integrity'
      additionalProperties: false
    TemplateFormat:
      type: string
      description: |
        Format of the template.
        One of ISO_19794_2, ISO_19794_2_NS, ISO_19794_2_CS, ISO_19794_2_2011, ANSI_378_2009 or ANSI_378.
        Can be extended to include additional proprietary template format
    QualityFormat:
      type: string
      description: |
        Format of the quality.
        One of ISO_19794, NFIQ, or NFIQ2.
        Can be extended to include additional proprietary quality format
    ImpressionType:
      type: string
      enum:
        - LIVE_SCAN_PLAIN
        - LIVE_SCAN_ROLLED
        - NONLIVE_SCAN_PLAIN
        - NONLIVE_SCAN_ROLLED
        - LATENT_IMPRESSION
        - LATENT_TRACING
        - LATENT_PHOTO
        - LATENT_LIFT
        - LIVE_SCAN_SWIPE
        - LIVE_SCAN_VERTICAL_ROLL
        - LIVE_SCAN_PALM
        - NONLIVE_SCAN_PALM
        - LATENT_PALM_IMPRESSION
        - LATENT_PALM_TRACING
        - LATENT_PALM_PHOTO
        - LATENT_PALM_LIFT
        - LIVE_SCAN_OPTICAL_CONTACTLESS_PLAIN
        - OTHER
        - UNKNOWN
    BiometricType:
      type: string
      enum:
        - FACE
        - FINGER
        - IRIS
        - SIGNATURE
        - UNKNOWN
      example: FINGER
    BiometricSubType:
      type: string
      enum:
        - UNKNOWN
        - RIGHT_THUMB
        - RIGHT_INDEX
        - RIGHT_MIDDLE
        - RIGHT_RING
        - RIGHT_LITTLE
        - LEFT_THUMB
        - LEFT_INDEX
        - LEFT_MIDDLE
        - LEFT_RING
        - LEFT_LITTLE
        - PLAIN_RIGHT_FOUR_FINGERS
        - PLAIN_LEFT_FOUR_FINGERS
        - PLAIN_THUMBS
        
        - UNKNOWN_PALM
        - RIGHT_FULL_PALM
        - RIGHT_WRITERS_PALM
        - LEFT_FULL_PALM
        - LEFT_WRITERS_PALM
        - RIGHT_LOWER_PALM
        - RIGHT_UPPER_PALM
        - LEFT_LOWER_PALM
        - LEFT_UPPER_PALM
        - RIGHT_OTHER
        - LEFT_OTHER
        - RIGHT_INTERDIGITAL
        - RIGHT_THENAR
        - RIGHT_HYPOTHENAR
        - LEFT_INTERDIGITAL
        - LEFT_THENAR
        - LEFT_HYPOTHENAR
        
        - RIGHT_INDEX_AND_MIDDLE
        - RIGHT_MIDDLE_AND_RING
        - RIGHT_RING_AND_LITTLE
        - LEFT_INDEX_AND_MIDDLE
        - LEFT_MIDDLE_AND_RING
        - LEFT_RING_AND_LITTLE
        - RIGHT_INDEX_AND_LEFT_INDEX
        - RIGHT_INDEX_AND_MIDDLE_AND_RING
        - RIGHT_MIDDLE_AND_RING_AND_LITTLE
        - LEFT_INDEX_AND_MIDDLE_AND_RING
        - LEFT_MIDDLE_AND_RING_AND_LITTLE
        
        - EYE_UNDEF
        - EYE_RIGHT
        - EYE_LEFT
        - EYE_BOTH
        
        - PORTRAIT
        - LEFT_PROFILE
        - RIGHT_PROFILE
      example: RIGHT_INDEX

    CompressionType:
      type: string
      enum: [NONE, WSQ, JPEG, JPEG2000, PNG]
      example: WSQ

    MissingType:
      type: object
      properties:
        biometricSubType:
          $ref: '#/components/schemas/BiometricSubType'
        presence:
          type: string
          enum: [BANDAGED, AMPUTATED, DAMAGED]
      additionalProperties: false
    
    CredentialData:
      description: A credential
      type: object
      properties:
        credentialId:
          type: string
          description: The unique id for this credential
          readOnly: true
        status:
          type: string
          description: The status of the credential
          enum: [NEW, ACTIVE, SUSPENDED, REVOKED, OTHER]
          readOnly: true
        statusOther:
          type: string
          description: Details about the status when OTHER is used
          readOnly: true
        credentialNumber:
          type: string
          description: "The number attached to the credential (ex: passport number)"
        personId:
          type: string
          description: The unique id of the person that the credential request is for
        credentialType:
            $ref: '#/components/schemas/CredentialType'
        issuedDate:
          type: string
          format: date-time
          description: The date and time that this credential was issued
        expiryDate:
          type: string
          format: date-time
          description: The date and time that this credential expires
        serialNumber:
          type: string
          description: the serial number of the credential
        issuingAuthority:
          type: string
          description: "The authority issuing the credential (ex: the Ministry of Interior)"
        issuingPlace:
          type: string
          description: "The place where the credential was issued (ex: Paris)"
        others:
          type: object
          additionalProperties: true
      additionalProperties: false

    CredentialType:
      description: Type of the credential. e.g. "PASSPORT", "ID_CARD", ...
      type: string
      example: "ID_CARD"
    
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: Error code
          type: integer
          format: int32
        message:
          description: Error message
          type: string
      additionalProperties: false


    OutputAttributeSet:
      type: object
      description: A template describing the expected attributes of a readAttributes request
      properties:
        outputBiographicData:
          description : list of BiographicData structure fields to include in the answer
          type: array
          items: 
              type: string
          example : ["firstName","lastname"]
        outputBiometricData:
          type: array
          description : an array of expected biometric data & fields
          items:
            type: object
            description : biometric type and subtype, list of BiometricData fields to include in the answer
            properties:
              biometricType:
                $ref: '#/components/schemas/BiometricType'
              biometricSubType:
                $ref: '#/components/schemas/BiometricSubType'
              biometricDataFields:
                type: array
                example :  ["image","captureDate"]
                items: 
                  type: string
        outputCredentialData:
          type: array
          description : an array of expected credential type & fields
          items:          
            type: object
            description : credential type and list of CredentialData structure fields to include in the answer
            properties:
              #TODO : check credential type vs cms.yaml!!
              credentialType:
                $ref: '#/components/schemas/CredentialType'
              credentialDataFields:
                type: array
                example :  ["serialNumber","validFromDate","validToDate"]
                items: 
                  type: string
        outputContactData:
          description : list of ContactData structure fields to include in the answer
          type: array
          example : ["phone1","email"]
          items: 
              type: string
              
      additionalProperties: false
    
    TaskId:
      description: |
        Information about the asynchronous result. Only the taskId is mandatory but
        the implementation is free to return additional details such as: expected
        duration, URL to monitor the task, etc.
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
          example: '123e4567-e89b-12d3-a456-426655440000'
        others:
          type: object
          additionalProperties: true
      additionalProperties: false

          # Mandate
    Mandate:
      type: object
      required:
        - mandateType
        - mandateReference
        - delegator
        - delegate
      properties:
        mandateType:
          type: string
          description: Type of mandate (e.g., LEGAL_REPRESENTATIVE, POWER_OF_ATTORNEY)
        mandateReference:
          type: string
          description: Unique reference to the registered mandate
        delegator:
          type: object
          properties:
            personIdentifier:
              type: string
            familyName:
              type: string
            givenName:
              type: string
        delegate:
          type: object
          properties:
            personIdentifier:
              type: string
            familyName:
              type: string
            givenName:
              type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        scope:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false

    MandateResult:
      type: object
      required:
        - mandateValid
        - mandateReference
      properties:
        mandateValid:
          type: boolean
        mandateReference:
          type: string
        validationTime:
          type: string
          format: date-time
        delegatorMatch:
          type: boolean
        delegateMatch:
          type: boolean
        validationDetails:
          type: object
          properties:
            mandateStatus:
              type: string
              enum: [ACTIVE, SUSPENDED, EXPIRED, REVOKED]
            scopeValid:
              type: boolean
      additionalProperties: false
